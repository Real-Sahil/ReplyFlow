<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a demo · ReplyFlow</title>
<meta name="description" content="Tell us about your business and we will arrange a short call to show you ReplyFlow.">
<meta property="og:title" content="Book a demo · ReplyFlow">
<meta property="og:description" content="Tell us about your business and we will arrange a short call to show you ReplyFlow.">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/site/site.css">
<script src="/site/boot.js"></script>
</head>
<body>
<div class="breathing" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="site-header">
    <a class="brand" href="/"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="rfm" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#6c9cfb"/><stop offset=".5" stop-color="#2f6bed"/><stop offset="1" stop-color="#1c4cc0"/></linearGradient></defs><rect width="100" height="100" rx="23" fill="url(#rfm)"/><path d="M26 30a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8v22a8 8 0 0 1-8 8H48L34 73V60a8 8 0 0 1-8-8z" fill="#fff"/><path d="M36 42h26m0 0-7-7m7 7-7 7" fill="none" stroke="#2f6bed" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ReplyFlow</span></a>
    <a class="btn small header-cta" href="/contact">Book a demo</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Menu">
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="site-menu" aria-label="Main">
        <a href="/features">Features</a>
        <a href="/pricing">Pricing</a>
        <a href="/blog">Blog</a>
        <a href="/app">Sign in</a>
    </nav>
  </header>
  <main>

    <section class="hero">
      <h1>Book a demo</h1>
      <p class="lede">Tell us a little about your business. We will reply to set up a short call and show you the app.</p>
    </section>
    <section class="block" style="padding-top:0">
      <form class="card narrow" id="enquiry" novalidate style="margin:0">
        <label>Your name <input name="name" required minlength="2" maxlength="80" autocomplete="name"></label>
        <label>Email <input name="email" type="email" maxlength="254" autocomplete="email"></label>
        <label>Phone (if you prefer a call) <input name="phone" type="tel" maxlength="20" autocomplete="tel"></label>
        <label>About your business <textarea name="message" required minlength="5" maxlength="1000" placeholder="What you sell, how many people work with you, and what is taking your time"></textarea></label>
        <label class="hp" aria-hidden="true">Leave this empty <input name="website" tabindex="-1" autocomplete="off"></label>
        <label class="check"><input name="consent" type="checkbox" required> <span>I agree ReplyFlow can reply to me about this enquiry. <a href="/privacy">Privacy policy</a></span></label>
        <button class="btn" type="submit">Send</button>
        <p id="status" role="status"></p>
      </form>
    </section>

  </main>
  <footer class="site-footer">
    <span>ReplyFlow. Built for owner-run UK businesses.</span>
    <nav aria-label="Footer">
      <a href="/features">Features</a>
      <a href="/pricing">Pricing</a>
      <a href="/blog">Blog</a>
      <a href="/contact">Contact</a>
      <a href="/privacy">Privacy policy</a>
      <a href="/app">Sign in</a>
    </nav>
  </footer>
</div>
<script src="/site/site.js" defer></script>
</body>
</html>
