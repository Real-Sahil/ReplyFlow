# Runs on every push and pull request. Each job is independent, so a failure in the
# browser tests does not hide the type, lint and function checks.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Types, lint, function tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit:functions
      - run: npm run build

  app-tests:
    name: App tests in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit:app
        env:
          CI: true
