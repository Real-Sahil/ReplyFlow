# Deploys the Edge Functions from the repository, so what runs live is what is in git.
# Needs one repository secret, SUPABASE_ACCESS_TOKEN (Supabase dashboard > Account >
# Access Tokens). Without it the job is skipped, so the pipeline stays green until it is set.
# Database migrations are not applied here: they go through the Supabase SQL editor or MCP.
name: Deploy functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mdhmuyhtimjkysvsardi
    steps:
      - name: Check the access token is set
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set, so nothing was deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.present == 'true'
        with:
          version: latest
      - name: Deploy every function
        if: steps.token.outputs.present == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
